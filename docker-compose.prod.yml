# Deployment: pulls the ready-made image from GitHub Container Registry instead of building it.
# The pipeline supplies IMAGE (and optionally DB_USER / DB_PASSWORD / DB_NAME).
services:
  web:
    image: ${IMAGE}
    ports:
      - "80:3000"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-bookuser}
      DB_PASSWORD: ${DB_PASSWORD:-bookpass}
      DB_NAME: ${DB_NAME:-bookdb}
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-bookuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bookpass}
      POSTGRES_DB: ${DB_NAME:-bookdb}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bookuser} -d ${DB_NAME:-bookdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

volumes:
  db_data:
